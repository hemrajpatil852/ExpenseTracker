# Render Blueprint: free web service + free Postgres. Deploy the frontend on Vercel.
databases:
  - name: finance-db
    plan: free
services:
  - type: web
    name: finance-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: finance-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-APP.vercel.app
